server {
    listen 80;
    server_name share-secret.schengatto.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 off;
    server_name share-secret.schengatto.com;

    ssl_certificate     /etc/letsencrypt/live/schengatto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schengatto.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 27m;
    access_log off;

    location / {
        set $upstream_share_secret share-secret;
        proxy_pass         http://$upstream_share_secret:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
